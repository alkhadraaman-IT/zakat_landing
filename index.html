<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زكاة العلم - تفاصيل المحاضرة</title>
<meta name="description" content="محاضرات علمية تطوعية حضورية مجانية لطلاب الجامعات والمعاهد.">
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#14211c;--muted:#5b6b64;--accent:#0f766e;--on-accent:#fff;--line:#e2e8e4}
@media (prefers-color-scheme:dark){:root{--bg:#0c1311;--card:#141d1a;--text:#e8f0ec;--muted:#9fb1a9;--accent:#2dd4bf;--on-accent:#06201c;--line:#24332e}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
header{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pill{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:1px 10px;border-radius:999px;margin-bottom:8px}
h1{font-size:24px;line-height:1.4;margin:0 0 8px}
.by{color:var(--muted);font-size:14px;margin:0 0 14px}
.desc{white-space:pre-wrap;margin:0 0 16px}
.row{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:14px}
.row b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.msg{text-align:center;color:var(--muted);padding:30px 10px;margin:0}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.btn{flex:1;max-width:260px;text-align:center;padding:14px 10px;border-radius:12px;font-weight:700;text-decoration:none;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.primary{background:var(--accent);color:var(--on-accent)}
[hidden]{display:none!important}
.loader{border:4px solid var(--line);border-top:4px solid var(--accent);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:40px auto;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">🎓</div>
    <div>زكاة العلم</div>
  </header>

  <!-- شاشة التحميل -->
  <div id="loading" class="card">
    <div class="loader"></div>
    <p class="msg">جاري تحميل تفاصيل المحاضرة...</p>
  </div>

  <!-- شاشة الخطأ -->
  <div id="error-card" class="card" hidden>
    <h1>عذراً، لم يتم العثور على المحاضرة</h1>
    <p class="desc">قد يكون الرابط غير صحيح أو تم حذف المحاضرة.</p>
  </div>

  <!-- بطاقة المحاضرة الحقيقية -->
  <div id="session-card" class="card" hidden>
    <span class="pill" id="category">محاضرة</span>
    <h1 id="title">عنوان المحاضرة</h1>
    <p class="by" id="lecturer">المحاضر</p>
    <p class="desc" id="description">وصف المحاضرة...</p>
    
    <div class="row">
      <b>التاريخ والوقت</b>
      <span id="date-time">-</span>
    </div>
    
    <div class="row">
      <b>المكان</b>
      <span id="location">-</span>
    </div>

    <div class="row">
      <b>المقاعد المتاحة</b>
      <span id="seats">-</span>
    </div>
  </div>
</div>

<!-- الشريط السفلي لزر التنزيل -->
<div class="bar">
  <a href="#" class="btn primary" id="download-btn">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/></svg>
    تنزيل التطبيق
  </a>
</div>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
   // ⚠️ ضع القيم الخاصة بك هنا
  const SUPABASE_URL = 'https://krhrpvcpjfstcfjlxhot.supabase.co'; 
  const SUPABASE_ANON_KEY = 'sb_publishable_KwCyi03am395kLe1yAUNbA_1yH9_e7Z';

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadSession() {
    // استخراج ID المحاضرة من الرابط
    // يفترض أن الرابط هكذا: https://username.github.io/repo/?id=123 أو https://username.github.io/repo/123
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('id') || urlParams.get('session');
    
    // إذا لم يوجد في الـ query params، نحاول قراءته من المسار (مثل /session/123)
    if (!sessionId) {
      const pathParts = window.location.pathname.split('/').filter(p => p);
      if (pathParts.length > 0) {
        const lastPart = pathParts[pathParts.length - 1];
        // تأكد أن آخر جزء ليس اسم الملف (index.html)
        if (lastPart !== 'index.html' && lastPart !== '') {
          sessionId = lastPart;
        }
      }
    }

    if (!sessionId) {
      showError();
      return;
    }

    try {
      // جلب البيانات من قاعدة البيانات
      const { data: session, error } = await supabase
        .from('sessions')
        .select('*, publisher:profiles!publisher_id(name), category:categories(name_ar)')
        .eq('id', sessionId)
        .maybeSingle();

      if (error || !session) {
        showError();
        return;
      }

      // تعبئة البيانات في الصفحة
      document.getElementById('title').textContent = session.title || 'محاضرة بدون عنوان';
      document.getElementById('description').textContent = session.description || 'لا يوجد وصف.';
      
      // اسم المحاضر
      const lecturerName = session.publisher?.name || 'غير محدد';
      document.getElementById('lecturer').textContent = `المحاضر: ${lecturerName}`;

      // التصنيف
      if (session.category?.name_ar) {
        document.getElementById('category').textContent = session.category.name_ar;
      }

      // التاريخ والوقت
      if (session.starts_at) {
        const dateObj = new Date(session.starts_at);
        const dateStr = dateObj.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('date-time').textContent = `${dateStr} - ${timeStr}`;
      }

      // المكان
      const place = session.place_name || '';
      const city = session.city || '';
      const locationStr = [place, city].filter(Boolean).join(' - ');
      document.getElementById('location').textContent = locationStr || 'غير محدد';

      // المقاعد
      const booked = session.booked_count || 0;
      const max = session.max_seats || 0;
      const remaining = Math.max(0, max - booked);
      document.getElementById('seats').textContent = `${booked} / ${max} (متبقي ${remaining} مقعد)`;

      // إظهار البطاقة وإخفاء التحميل
      document.getElementById('loading').hidden = true;
      document.getElementById('session-card').hidden = false;

      // تحديث رابط التنزيل (ضع هنا روابط المتاجر الخاصة بك)
      // document.getElementById('download-btn').href = 'https://play.google.com/store/apps/details?id=YOUR_APP_ID';

    } catch (err) {
      console.error(err);
      showError();
    }
  }

  function showError() {
    document.getElementById('loading').hidden = true;
    document.getElementById('error-card').hidden = false;
  }

  // تشغيل الدالة فور فتح الصفحة
  loadSession();
</script>
</body>
</html>
