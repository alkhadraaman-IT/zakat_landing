<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زكاة العلم</title>
<meta name="description" content="محاضرات علمية تطوعية حضورية مجانية لطلاب الجامعات والمعاهد.">
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#14211c;--muted:#5b6b64;--accent:#0f766e;--on-accent:#fff;--line:#e2e8e4}
@media (prefers-color-scheme:dark){:root{--bg:#0c1311;--card:#141d1a;--text:#e8f0ec;--muted:#9fb1a9;--accent:#2dd4bf;--on-accent:#06201c;--line:#24332e}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
header{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pill{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);padding:1px 10px;border-radius:999px;margin-bottom:8px}
h1{font-size:24px;line-height:1.4;margin:0 0 8px}
.by{color:var(--muted);font-size:14px;margin:0 0 14px}
.desc{white-space:pre-wrap;margin:0 0 16px}
.row{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:14px}
.row b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.msg{text-align:center;color:var(--muted);padding:30px 10px;margin:0}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.btn{flex:1;max-width:260px;text-align:center;padding:14px 10px;border-radius:12px;font-weight:700;text-decoration:none;font-size:15px}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{border:1px solid var(--accent);color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
