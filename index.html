<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زكاة العلم - تفاصيل المحاضرة</title>
<style>
:root{
  /* 🎨 ضع كود لون التطبيق الخاص بك هنا (AppColors.primary) */
  --primary: #00e5a0; /* قمت بتقريبه للون الشعار، ضع كودك الدقيق هنا */
  --primary-glow: rgba(0, 229, 160, 0.4); 
  --on-primary: #000000; 
  
  /* ألوان الوضع الداكن */
  --bg: #090e0c;
  --card: #111a16;
  --text: #e8f0ec;
  --muted: #9fb1a9;
  --line: #1e2e27;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}

header{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;margin-bottom:24px; flex-direction: row-reverse; justify-content: flex-end;}
.logo-img{width:44px;height:44px;object-fit:contain; border-radius: 50%; filter: drop-shadow(0 0 10px var(--primary-glow));}
.logo-text { color: var(--text); text-shadow: 0 0 8px var(--primary-glow); }

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0, 229, 160, 0.05);
}
.pill{display:inline-block;font-size:12px;color:var(--primary);border:1px solid var(--primary);padding:2px 12px;border-radius:999px;margin-bottom:12px; box-shadow: 0 0 8px var(--primary-glow);}
h1{font-size:24px;line-height:1.4;margin:0 0 8px; color: var(--text); text-shadow: 0 0 15px rgba(255,255,255,0.1);}
.by{color:var(--muted);font-size:14px;margin:0 0 16px}
.desc{white-space:pre-wrap;margin:0 0 16px; color:#cbd5d1;}
.row{padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--line);margin-top:10px;font-size:14px}
.row b{display:block;font-size:12px;color:var(--primary);font-weight:500;margin-bottom:4px}
.msg{text-align:center;color:var(--muted);padding:30px 10px;margin:0}

.bar{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;box-shadow: 0 -5px 20px rgba(0,0,0,0.5);}
.btn{width:100%;max-width:300px;text-align:center;padding:15px 10px;border-radius:12px;font-weight:700;text-decoration:none;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px; background:var(--primary);color:var(--on-primary); box-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow); transition: all 0.3s ease;}
.btn:hover{transform: translateY(-2px); box-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary-glow);}

[hidden]{display:none!important}
.loader{border:4px solid var(--line);border-top:4px solid var(--primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:40px auto; box-shadow: 0 0 15px var(--primary-glow);}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-text">زكاة العلم</div>
    <img src="logo_app.png" alt="زكاة العلم" class="logo-img" onerror="this.style.display='none'">
  </header>

  <div id="loading" class="card">
    <div class="loader"></div>
    <p class="msg">جاري تحميل تفاصيل المحاضرة...</p>
  </div>

  <div id="error-card" class="card" hidden style="border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);">
    <h1 style="color: #ef4444; text-shadow: none;">عذراً، لم يتم العثور على المحاضرة</h1>
    <p class="desc" id="error-message">قد يكون الرابط غير صحيح أو تم حذف المحاضرة.</p>
  </div>

  <div id="session-card" class="card" hidden>
    <span class="pill" id="category">محاضرة</span>
    <h1 id="title">عنوان المحاضرة</h1>
    <p class="by" id="lecturer">المحاضر</p>
    <p class="desc" id="description">وصف المحاضرة...</p>
    
    <div class="row">
      <b>التاريخ والوقت</b>
      <span id="date-time">-</span>
    </div>
    
    <div class="row">
      <b>المكان</b>
      <span id="location">-</span>
    </div>

    <div class="row">
      <b>المقاعد المتاحة</b>
      <span id="seats">-</span>
    </div>
  </div>
</div>

<div class="bar">
  <a href="#" class="btn" id="download-btn">
    <!-- تم تصحيح أيقونة التنزيل هنا (بدلاً من فيسبوك) -->
    <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 0h-2V7h2v5zm0 4h-2v-2h2v2z"/></svg>
    تنزيل التطبيق
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ⚠️ بيانات Supabase الخاصة بك
  const SUPABASE_URL = 'https://krhrpvcpjfstcfjlxhot.supabase.co'; 
  const SUPABASE_ANON_KEY = 'sb_publishable_KwCyi03am395kLe1yAUNbA_1yH9_e7Z';

  // تم تغيير اسم المتغير إلى _supabase لتجنب التعارض
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadSession() {
    let sessionId = null;
    
    if (window.location.hash) {
      const hashParts = window.location.hash.replace('#', '').split('/').filter(p => p);
      if (hashParts.length > 0) sessionId = hashParts[hashParts.length - 1];
    }
    
    if (!sessionId) {
      const urlParams = new URLSearchParams(window.location.search);
      sessionId = urlParams.get('id') || urlParams.get('session');
    }

    if (!sessionId) {
      showError("رقم المحاضرة غير موجود في الرابط.");
      return;
    }

    try {
      const { data: session, error } = await _supabase
        .from('sessions')
        .select('*, publisher:profiles!publisher_id(name), category:categories(name_ar)')
        .eq('id', sessionId)
        .maybeSingle();

      if (error) {
        console.error("Supabase Error:", error);
        showError("حدث خطأ في الاتصال بقاعدة البيانات: " + error.message);
        return;
      }

      if (!session) {
        showError("لم يتم العثور على محاضرة بهذا الرقم.");
        return;
      }

      document.getElementById('title').textContent = session.title || 'محاضرة بدون عنوان';
      document.getElementById('description').textContent = session.description || 'لا يوجد وصف.';
      
      const lecturerName = session.publisher?.name || 'غير محدد';
      document.getElementById('lecturer').textContent = `المحاضر: ${lecturerName}`;

      if (session.category?.name_ar) {
        document.getElementById('category').textContent = session.category.name_ar;
      }

      if (session.starts_at) {
        const dateObj = new Date(session.starts_at);
        const dateStr = dateObj.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('date-time').textContent = `${dateStr} - ${timeStr}`;
      }

      const place = session.place_name || '';
      const city = session.city || '';
      const locationStr = [place, city].filter(Boolean).join(' - ');
      document.getElementById('location').textContent = locationStr || 'غير محدد';

      const booked = session.booked_count || 0;
      const max = session.max_seats || 0;
      const remaining = Math.max(0, max - booked);
      document.getElementById('seats').textContent = `${booked} / ${max} (متبقي ${remaining} مقعد)`;

      document.getElementById('loading').hidden = true;
      document.getElementById('session-card').hidden = false;

    } catch (err) {
      console.error("Catch Error:", err);
      showError("خطأ غير متوقع: " + err.message);
    }
  }

  function showError(msg) {
    document.getElementById('loading').hidden = true;
    document.getElementById('error-card').hidden = false;
    if (msg) {
      document.getElementById('error-message').textContent = msg;
    }
  }

  loadSession();
</script>
</body>
</html>
